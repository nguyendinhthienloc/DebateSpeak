services:
  db:
    image: postgres:16-alpine
    container_name: debatespeak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-debatespeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debatespeak_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-debatespeak}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-debatespeak} -d ${POSTGRES_DB:-debatespeak}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - debatespeak-network

  redis:
    image: redis:7-alpine
    container_name: debatespeak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - debatespeak-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: debatespeak-livekit
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"       # HTTP API & WebSocket signaling
      - "7881:7881"       # WebRTC over TCP fallback
      - "7882:7882/udp"   # WebRTC over UDP
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - debatespeak-network

  api:
    profiles: ["full"]
    build:
      context: ./api/authify
      dockerfile: Dockerfile
    container_name: debatespeak-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-debatespeak}
      DATABASE_USERNAME: ${POSTGRES_USER:-debatespeak}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-debatespeak_dev_password}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-${APP_JWT_SECRET:-}}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    networks:
      - debatespeak-network

  web:
    profiles: ["full"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: debatespeak-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - debatespeak-network

volumes:
  postgres_data:
    name: debatespeak_postgres_data
  redis_data:
    name: debatespeak_redis_data

networks:
  debatespeak-network:
    name: debatespeak-network
    driver: bridge
