spring.application.name=authify
server.port=8000

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-seconds=3600
app.cors.allowed-origins=http://localhost:5173

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/debatespeak}
spring.datasource.username=${DATABASE_USERNAME:debatespeak}
spring.datasource.password=${DATABASE_PASSWORD:debatespeak_dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Media credentials are optional for local room lifecycle development. The token
# endpoint returns 503 until all three values are configured by the environment.
LIVEKIT_URL=${LIVEKIT_URL:}
LIVEKIT_API_KEY=${LIVEKIT_API_KEY:}
LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:}
