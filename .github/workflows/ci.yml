name: DebateSpeak CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'pa*'
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - dev
      - 'pa*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-invariants:
    name: 🛡️ Security & Architecture Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify No Tracked .env Secrets
        run: |
          echo "Checking for accidental tracked .env files..."
          if git ls-files | grep -E '^\.env(\..+)?$' | grep -v '\.env\.example'; then
            echo "::error::Found tracked .env file in git index! Secrets must never be committed."
            exit 1
          fi
          echo "No tracked secret files found."

      - name: Verify Zero Hardcoded Absolute Paths
        run: |
          echo "Scanning for hardcoded machine paths..."
          # Check for Windows/Linux absolute paths in source code
          ERRORS=$(git grep -EI '(D:\\[a-zA-Z0-9_\\]+|C:\\Users\\[a-zA-Z0-9_\\]+|/home/[a-zA-Z0-9_]+)' -- 'api/*' 'workers/*' 'web/*' || true)
          if [ -n "$ERRORS" ]; then
            echo "::error::Detected hardcoded absolute paths in source files:"
            echo "$ERRORS"
            exit 1
          fi
          echo "Zero hardcoded paths verified."

  backend-ci:
    name: 🐍 Backend (Python / FastAPI)
    runs-on: ubuntu-latest
    needs: security-and-invariants
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e "api/[dev]"

      - name: Ruff Linter Check
        run: |
          ruff check api/ workers/ tests/

      - name: Ruff Format Check
        run: |
          ruff format --check api/ workers/ tests/

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest tests/ -v

  frontend-ci:
    name: ⚛️ Frontend (React / Vite / TypeScript)
    runs-on: ubuntu-latest
    needs: security-and-invariants
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: |
          npm ci

      - name: TypeScript Type Check & Build
        working-directory: web
        run: |
          npm run build

  migrate-seed-ci:
    name: 🗄️ DB Migrate & Seed (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: security-and-invariants
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: debatespeak
          POSTGRES_PASSWORD: debatespeak_ci_password
          POSTGRES_DB: debatespeak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debatespeak -d debatespeak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+asyncpg://debatespeak:debatespeak_ci_password@localhost:5432/debatespeak
      PGHOST: localhost
      PGUSER: debatespeak
      PGPASSWORD: debatespeak_ci_password
      PGDATABASE: debatespeak
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Check SCRUM-41 Prerequisites
        id: gate
        run: |
          # api/alembic.ini may exist as an empty placeholder, so test for non-empty (-s).
          if [ -s api/alembic.ini ] && [ -f api/app/seed.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Alembic config and seed script found. Running migrate and seed."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping migrate/seed: api/alembic.ini (non-empty) or api/app/seed.py missing. Waiting for SCRUM-41."
          fi

      - name: Set up Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e "api/"

      - name: Run Alembic Migrations
        if: steps.gate.outputs.run == 'true'
        working-directory: api
        run: |
          alembic upgrade head

      - name: Run Seed Script
        if: steps.gate.outputs.run == 'true'
        working-directory: api
        run: |
          python -m app.seed

      - name: Verify Seed Result
        if: steps.gate.outputs.run == 'true'
        run: |
          check() {
            actual=$(psql -tA -c "SELECT count(*) FROM $1")
            echo "$1: expected $2, got $actual"
            if [ "$actual" != "$2" ]; then
              echo "::error::Seed check failed for $1 (expected $2, got $actual)"
              exit 1
            fi
          }
          check users 5
          check debate_topics 10
          check rooms 1
