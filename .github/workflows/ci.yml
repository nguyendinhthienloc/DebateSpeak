name: DebateSpeak CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'pa*'
      - 'feature/**'
      - 'bugfix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - dev
      - 'pa*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-invariants:
    name: 🛡️ Security & Architecture Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify No Tracked .env Secrets
        run: |
          echo "Checking for accidental tracked .env files..."
          if git ls-files | grep -E '^\.env(\..+)?$' | grep -v '\.env\.example'; then
            echo "::error::Found tracked .env file in git index! Secrets must never be committed."
            exit 1
          fi
          echo "No tracked secret files found."

      - name: Verify Zero Hardcoded Absolute Paths
        run: |
          echo "Scanning for hardcoded machine paths..."
          ERRORS=$(git grep -EI '(D:\\[a-zA-Z0-9_\\]+|C:\\Users\\[a-zA-Z0-9_\\]+|/home/[a-zA-Z0-9_]+)' -- 'api/*' 'workers/*' 'web/*' || true)
          if [ -n "$ERRORS" ]; then
            echo "::error::Detected hardcoded absolute paths in source files:"
            echo "$ERRORS"
            exit 1
          fi
          echo "Zero hardcoded paths verified."

  spring-boot-ci:
    name: ☕ Backend API (Java 17 / Spring Boot + PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: security-and-invariants
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: debatespeak
          POSTGRES_PASSWORD: debatespeak_ci_password
          POSTGRES_DB: debatespeak
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U debatespeak -d debatespeak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: api/authify/pom.xml

      - name: Run Maven Tests & Package
        working-directory: api/authify
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/debatespeak
          DATABASE_USERNAME: debatespeak
          DATABASE_PASSWORD: debatespeak_ci_password
          APP_JWT_SECRET: ci-test-jwt-secret-key-at-least-32-bytes-long
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-bytes-long
          FRONTEND_URL: http://localhost:5173
        run: |
          chmod +x mvnw
          ./mvnw -B test
          ./mvnw -B -DskipTests package

  python-workers-ci:
    name: 🐍 Python Workers & AI Adapters
    runs-on: ubuntu-latest
    needs: security-and-invariants
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e "api/[dev]"

      - name: Ruff Linter Check
        run: |
          ruff check api/ workers/ tests/

      - name: Ruff Format Check
        run: |
          ruff format --check api/ workers/ tests/

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest tests/ -v

  frontend-ci:
    name: ⚛️ Frontend (React / Vite / TypeScript)
    runs-on: ubuntu-latest
    needs: security-and-invariants
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: |
          npm ci

      - name: Lint Frontend Code
        working-directory: web
        run: |
          npm run lint

      - name: TypeScript Type Check & Build
        working-directory: web
        run: |
          npm run build

  docker-ci:
    name: 🐳 Docker Compose & Dockerfile Validation
    runs-on: ubuntu-latest
    needs: security-and-invariants
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        run: |
          docker compose config --quiet
          docker compose --profile full config --quiet

      - name: Verify Dockerfiles Exist and Are Non-Empty
        run: |
          for dockerfile in api/authify/Dockerfile web/Dockerfile; do
            if [ ! -s "$dockerfile" ]; then
              echo "::error::Missing or empty Dockerfile: $dockerfile"
              exit 1
            fi
            echo "Verified non-empty Dockerfile: $dockerfile"
          done
