name: DebateSpeak CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'pa*'
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - dev
      - 'pa*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-invariants:
    name: 🛡️ Security & Architecture Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify No Tracked .env Secrets
        run: |
          echo "Checking for accidental tracked .env files..."
          if git ls-files | grep -E '^\.env(\..+)?$' | grep -v '\.env\.example'; then
            echo "::error::Found tracked .env file in git index! Secrets must never be committed."
            exit 1
          fi
          echo "No tracked secret files found."

      - name: Verify Zero Hardcoded Absolute Paths
        run: |
          echo "Scanning for hardcoded machine paths..."
          # Check for Windows/Linux absolute paths in source code
          ERRORS=$(git grep -EI '(D:\\[a-zA-Z0-9_\\]+|C:\\Users\\[a-zA-Z0-9_\\]+|/home/[a-zA-Z0-9_]+)' -- 'api/*' 'workers/*' 'web/*' || true)
          if [ -n "$ERRORS" ]; then
            echo "::error::Detected hardcoded absolute paths in source files:"
            echo "$ERRORS"
            exit 1
          fi
          echo "Zero hardcoded paths verified."

  backend-ci:
    name: 🐍 Backend (Python / FastAPI)
    runs-on: ubuntu-latest
    needs: security-and-invariants
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e "api/[dev]"

      - name: Ruff Linter Check
        run: |
          ruff check api/ workers/ tests/

      - name: Ruff Format Check
        run: |
          ruff format --check api/ workers/ tests/

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest tests/ -v

  frontend-ci:
    name: ⚛️ Frontend (React / Vite / TypeScript)
    runs-on: ubuntu-latest
    needs: security-and-invariants
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: |
          npm ci

      - name: TypeScript Type Check & Build
        working-directory: web
        run: |
          npm run build

  academic-report-ci:
    name: 📄 Academic Report (latexmk)
    runs-on: ubuntu-latest
    needs: security-and-invariants
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install TeX Live & latexmk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-other \
            latexmk

      - name: Compile Academic Report PDF
        run: |
          cd report
          latexmk -pdf -interaction=nonstopmode report.tex || true
          if [ -f "build/report.pdf" ] || [ -f "report.pdf" ]; then
            echo "Academic report compiled successfully."
          else
            echo "::error::report.pdf was not generated."
            cat build/report.log || cat report.log || true
            exit 1
          fi
